version: "3.8"
#docker compose -f docker-compose-redis.yml up -d
#docker exec -it crowndine_redis redis-cli FLUSHDB
services:
  redis:
    image: redis:latest
    container_name: crowndine_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
