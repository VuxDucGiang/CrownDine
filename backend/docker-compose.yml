version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crowndine-image
    container_name: crowndine-app
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USERNAME: user
      DATABASE_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest

  mysql:
    image: mysql:8.0
    container_name: crowndine_db
    restart: always
    environment:
      MYSQL_DATABASE: crowndine
      MYSQL_USER: user
      MYSQL_PASSWORD: 123456
      MYSQL_ROOT_PASSWORD: 1234567
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'

  redis:
    image: redis:latest
    container_name: crowndine_redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:latest
    container_name: crowndine_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
volumes:
  mysql_data:
