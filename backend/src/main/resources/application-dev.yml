spring:
  config:
    activate:
      on-profile: dev
  devtools:
    add-properties: true
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/crowndine
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:123456}
    hikari: # Connection poll
      max-lifetime: 300000 # 5 phút
      idle-timeout: 60000 # 1 phút
      validation-timeout: 5000 # 5 giây
      minimum-idle: 5
      maximum-pool-size: 20
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:/dev/db/migration
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  mail:
    from: ${MAIL_USERNAME:dattqde181019@fpt.edu.vn}
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dattqde181019@fpt.edu.vn}
    password: ${MAIL_PASSWORD:krdmwfrkaizzvgwb}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.7
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      connect-timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

    publisher-confirm-type: correlated # Xác nhận tin đã đến Exchange chưa
    publisher-returns: true            # Trả về tin nhắn nếu không thể routing vào Queue
    template:
      mandatory: true                  # Bắt buộc trả về tin nếu lỗi routing
      retry:
        enabled: true                  # Tự động gửi lại nếu gặp lỗi mạng tạm thời
        initial-interval: 1000ms
        max-attempts: 3

    listener:
      simple:
        acknowledge-mode: manual       # Chế độ xác nhận thủ công (an toàn nhất)
        prefetch: 1                    # Mỗi lần chỉ lấy 1 tin (tránh quá tải)
        concurrency: 2                 # Số lượng luồng xử lý song song tối thiểu
        max-concurrency: 5             # Số lượng luồng tối đa
        retry:
          enabled: false
          max-attempts: 3              # Thử lại 3 lần nếu code xử lý bị exception

