name: CI Backend PR

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-be-pr.yml"

concurrency:
  group: ci-be-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test Backend (PR)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Compile Code
        run: ./mvnw -B -ntp clean compile -DskipTests

      - name: Build and test with Maven
        run: ./mvnw -B -ntp -Ptest verify
